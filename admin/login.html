<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/admin/styles/index.css">
    <link rel="stylesheet" href="/admin/styles/login.css">
</head>

<body>
    <div id="login-page">
        <div class="login-box">
            <h1>Kovbasnuk Admin Panel</h1>
            <form class="login-form">
                <div class="login-field">
                    <label for="inp-email">Email</label>
                    <input id="inp-email" name="email" type="text" placeholder="example@gmail.com">
                </div>

                <div class="login-field">
                    <label for="inp-password">Password</label>
                    <input id="inp-password" name="password" type="password" placeholder="zxc123">
                </div>

                <p class="login-form__error">Логін або пароль невірний</p>

                <button class="login-button">Увійти</button>
            </form>
        </div>
    </div>

    <script src="/admin/scripts/login.js" type="module"></script>
</body>

</html>
